<ul class="divide-y divide-white/[0.06]" aria-label="Users list">
  @for (user of users(); track user.id) {
    <li class="user-card">
      <!-- Card header: name + actions menu -->
      <div class="card-header">
        <div class="card-identity">
          <span class="card-name">{{ user.firstName }} {{ user.lastName }}</span>
          <span class="card-username">@{{ user.username }}</span>
        </div>

        <button
          mat-icon-button
          [matMenuTriggerFor]="mobileMenu"
          [attr.aria-label]="'More actions for ' + user.firstName + ' ' + user.lastName"
        >
          <mat-icon>more_vert</mat-icon>
        </button>

        <mat-menu #mobileMenu="matMenu">
          <button mat-menu-item (click)="onView(user)">
            <mat-icon>visibility</mat-icon>
            View user
          </button>
          <button mat-menu-item (click)="onEdit(user)">
            <mat-icon>edit</mat-icon>
            Edit user
          </button>
          @if (user.active) {
            <button mat-menu-item (click)="onDeactivate(user)">
              <mat-icon>block</mat-icon>
              Deactivate user
            </button>
          } @else {
            <button mat-menu-item (click)="onActivate(user)">
              <mat-icon>check_circle</mat-icon>
              Activate user
            </button>
          }
          <button mat-menu-item (click)="onDelete(user)">
            <mat-icon color="warn">delete</mat-icon>
            Delete user
          </button>
        </mat-menu>
      </div>

      <!-- Card body: email + badges + date -->
      <div class="card-body">
        <p class="card-email">{{ user.email }}</p>

        <div class="card-badges">
          <app-user-role-badge [role]="user.role" />
          <app-user-status-badge [active]="user.active" />
        </div>

        <p class="card-date">
          Created: {{ user.createdAt ? (user.createdAt | date: 'mediumDate') : '—' }}
        </p>
      </div>
    </li>
  }
</ul>

<mat-paginator
  [length]="total()"
  [pageSize]="pageSize()"
  [pageIndex]="skip() / pageSize()"
  [pageSizeOptions]="[10]"
  (page)="onPageChange($event)"
  aria-label="Users pagination"
/>
