<div class="flex flex-col gap-6">
  <!-- Page header -->
  <div>
    <h1 class="text-2xl font-semibold">Create user</h1>
    <p class="mt-1 text-sm">Add a new user to your organization.</p>
  </div>

  <!-- Form card -->
  <div class="rounded-xl border border-white/10 bg-white/[0.015] shadow-sm p-6">
    <app-user-form
      [isSaving]="store.isSaving()"
      (submitForm)="onSubmit($event)"
      (cancelForm)="onCancel()"
    />
  </div>
</div>
