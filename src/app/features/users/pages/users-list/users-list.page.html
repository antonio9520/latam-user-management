<div class="flex flex-col gap-6">
  <!-- Page header -->
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold text-gray-900">Users</h1>
      <p class="mt-1 text-sm text-gray-500">Manage your organization's users.</p>
    </div>
    <button mat-raised-button color="primary" routerLink="new" aria-label="Create new user">
      <mat-icon>add</mat-icon>
      Create user
    </button>
  </div>

  <app-users-filters />
  <app-users-table (deleteRequest)="onDeleteRequest($event)" />
</div>
