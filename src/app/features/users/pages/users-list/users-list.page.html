<div class="flex flex-col gap-6">
  <!-- Page header -->
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold">Users</h1>
      <p class="mt-1 text-sm">Manage your organization's users.</p>
    </div>
    <button mat-flat-button color="primary" routerLink="new" aria-label="Create new user">
      <mat-icon>add</mat-icon>
      Create user
    </button>
  </div>

  <app-users-filters (filtersChange)="onFiltersChange($event)" />
  <app-users-table
    (deleteRequest)="onDeleteRequest($event)"
    (deactivateRequest)="onDeactivateRequest($event)"
    (activateRequest)="onActivateRequest($event)"
    (pageChange)="onPageChange($event)"
  />
</div>
